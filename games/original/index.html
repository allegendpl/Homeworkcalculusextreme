<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExtremeCalculus Originals</title><link rel="stylesheet" href="style.css"><script src="play.js" defer></script></head>
<body><main><header><h1 id="title">Original games</h1><span id="score" aria-live="polite">Ready</span></header><p id="instructions"></p><canvas id="board" width="480" height="480" tabindex="0" aria-label="Game board"></canvas><div id="tiles" class="tiles" hidden></div><p id="status" role="status">Press Start to play.</p><div class="buttons"><button id="start">Start / Restart</button><button id="pause" hidden>Pause</button></div><div id="directions" class="buttons" hidden><button data-dir="up" aria-label="Move up">↑</button><button data-dir="left" aria-label="Move left">←</button><button data-dir="down" aria-label="Move down">↓</button><button data-dir="right" aria-label="Move right">→</button></div><footer>Original code & artwork by ExtremeCalculus contributors · <a href="LICENSE.txt">MIT license</a></footer></main></body></html>
